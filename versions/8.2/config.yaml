  - "--enable-cgi"
  - "--disable-zend-signals"
  - "--disable-fiber-asm"
  - "--disable-opcache"
  - "--disable-phpdbg"
  - "--without-pear"
  - "--without-iconv"
  - "--without-openssl"
  - "--without-pcre-jit"

php_patches:
  - "0001-wasi-session-uid-stub"
  - "0002-wasi-csprng"
  - "0003-wasi-gd-syslog-tmpfile"
  - "0004-wasi-opcache-mmap-anon"
  - "0005-wasi-zend-madvise"
  - "0006-wasi-zend-chunk-alloc"
  - "0007-wasi-fcgi-stdin-stdout"

# 0001: VMware WasmLabs v8.2.6 comprehensive WASI port
# 0002: incapacitate fibers (no ucontext on wasm32-wasi)
version_patches:
  - "0001-wasi-initial-port"
  - "0002-wasi-fibers"

notes: "Security-fixes-only branch. Patches from VMware WasmLabs webassembly-language-runtimes/php/v8.2.6."
