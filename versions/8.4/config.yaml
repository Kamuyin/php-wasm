  - "--enable-cgi"
  - "--disable-zend-signals"
  - "--disable-fiber-asm"
  - "--disable-opcache"
  - "--disable-phpdbg"
  - "--without-pear"
  - "--without-iconv"
  - "--without-openssl"
  - "--without-pcre-jit"

php_patches:
  - "0001-wasi-session-uid-stub"
  - "0002-wasi-csprng"
  - "0003-wasi-gd-syslog-tmpfile"
  - "0004-wasi-opcache-mmap-anon"
  - "0005-wasi-zend-madvise"
  - "0006-wasi-zend-chunk-alloc"
  - "0007-wasi-fcgi-stdin-stdout"

# 0001: VMware WasmLabs master WASI port, forward-ported to 8.4
# 0002: property hooks vtable zero-init for wasm32 indirect call tables
# 0003: new-without-parens syntax adjustment
version_patches:
  - "0001-wasi-initial-port"
  - "0002-84-property-hooks-wasi"
  - "0003-84-new-without-parens"

notes: "Active branch. Validate object-handler and compiler internals when upgrading."
