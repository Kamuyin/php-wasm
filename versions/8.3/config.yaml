# $schema: ../../schemas/config.schema.json
php_version: "8.3.30"
source_tag: "php-8.3.30"
source_sha256: "e587dc95fb7f62730299fa7b36b6e4f91e6708aaefa2fff68a0098d320c16386"

configure_extra:
  - "--disable-all"
  - "--enable-cgi"
  - "--disable-zend-signals"
  - "--disable-fiber-asm"
  - "--disable-opcache"
  - "--disable-phpdbg"
  - "--without-pear"
  - "--without-iconv"
  - "--without-openssl"
  - "--without-pcre-jit"

php_patches:
  - "0001-wasi-session-uid-stub"
  - "0002-wasi-csprng"
  - "0003-wasi-gd-syslog-tmpfile"
  - "0004-wasi-opcache-mmap-anon"
  - "0005-wasi-zend-madvise"
  - "0006-wasi-zend-chunk-alloc"
  - "0007-wasi-fcgi-stdin-stdout"

# 0001: VMware WasmLabs master comprehensive WASI port (targeting 8.3)
# 0002: four stubs absent from 0001 on 8.3.30 (php_do_chown, dup, socket_strerror, php_mail)
version_patches:
  - "0001-wasi-initial-port"
  - "0002-83-wasi-missing-stubs"
  - "0003-83-wasi-fastcgi-cgi-main"
  - "0004-83-wasi-fastcgi-main"

notes: "Primary supported branch. Patches from VMware WasmLabs webassembly-language-runtimes/php/master."
