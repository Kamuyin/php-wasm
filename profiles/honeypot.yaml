# $schema: ../schemas/profile.schema.json
name: "honeypot"
description: "PHP 8.3 with private host-controlled observation and injection hooks"

configure_flags:
  - "--enable-mbstring"
  - "--disable-mbregex"
  - "--enable-ctype"
  - "--enable-filter"
  - "--enable-tokenizer"
  - "--enable-session"
  - "--enable-pdo"
  - "--with-pdo-sqlite=deps/sqlite3-wasm"
  - "--with-sqlite3=deps/sqlite3-wasm"
  - "--with-libxml=deps/libxml2-wasm"
  - "--enable-xml"
  - "--enable-dom"
  - "--enable-simplexml"
  - "--enable-xmlreader"
  - "--enable-xmlwriter"
  - "--enable-bcmath"
  - "--enable-calendar"
  - "--enable-fileinfo"
  - "--enable-exif"

extensions_snapshot:
  - json
  - mbstring
  - ctype
  - filter
  - tokenizer
  - session
  - pdo
  - pdo_sqlite
  - mysqli
  - pgsql
  - pdo_mysql
  - pdo_pgsql
  - sqlite3
  - xml
  - dom
  - simplexml
  - xmlreader
  - xmlwriter
  - bcmath
  - calendar
  - fileinfo
  - exif

required_libs: [sqlite3, libxml2]
expected_wasm_size_kb: 17000

notes: |
  PHP 8.3 only. Requires the php_wasm_runtime_v1 host import module in addition
  to WASI Preview1. No instrumentation extension, PHP functions, INI entries,
  application files or WordPress plugins are registered. Explicitly injected
  scripts can create visible application state. See docs/RUNTIME.md.
