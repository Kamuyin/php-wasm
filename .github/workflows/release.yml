name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write  # required for cosign keyless signing

jobs:
  build-release:
    name: Build ${{ matrix.php }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        profile: [minimal, default, full]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Docker build layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-release-${{ matrix.php }}-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.php }}-${{ matrix.profile }}-
            ${{ runner.os }}-buildx-${{ matrix.php }}-${{ matrix.profile }}-

      - name: Cache PHP source
        uses: actions/cache@v4
        with:
          path: /tmp/php-src-cache
          key: ${{ runner.os }}-php-src-${{ matrix.php }}-${{ hashFiles(format('versions/{0}/source.yaml', matrix.php)) }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/.ccache
          key: ${{ runner.os }}-release-ccache-${{ matrix.php }}-${{ matrix.profile }}-${{ hashFiles('docker/Dockerfile.builder', 'scripts/**', 'patches/**', 'versions/**', 'profiles/**') }}
          restore-keys: |
            ${{ runner.os }}-release-ccache-${{ matrix.php }}-${{ matrix.profile }}-
            ${{ runner.os }}-release-ccache-${{ matrix.php }}-
            ${{ runner.os }}-release-ccache-

      - name: Build PHP ${{ matrix.php }} (${{ matrix.profile }})
        run: |
          docker buildx build \
            --load \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --build-arg PROFILE=${{ matrix.profile }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag php-wasm-release:${{ matrix.php }}-${{ matrix.profile }} \
            --file docker/Dockerfile.builder \
            .

      - name: Extract artifacts
        run: |
          mkdir -p out
          docker run --rm \
            --mount type=bind,src="$(pwd)/out",dst=/out \
            --mount type=bind,src=/tmp/php-src-cache,dst=/tmp/php-src-cache \
            --mount type=bind,src=/tmp/.ccache,dst=/ccache \
            -e PHP_VERSION=${{ matrix.php }} \
            -e PROFILE=${{ matrix.profile }} \
            -e OUTPUT_DIR=/out \
            -e BUILD_CACHE_DIR=/tmp/php-src-cache \
            php-wasm-release:${{ matrix.php }}-${{ matrix.profile }}
          ls -lh out/

      - name: Rotate Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.php }}-${{ matrix.profile }}
          path: |
            out/*.wasm
            out/*.sha256

  publish-release:
    name: Publish GitHub Release + OCI Artifacts
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/
          merge-multiple: true
          pattern: release-*

      - name: Install oras
        run: |
          ORAS_VERSION="1.1.0"
          curl -fsSL -o /tmp/oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras
          oras version

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI artifacts and sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          REGISTRY: ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          chmod +x scripts/package.sh
          for wasm in out/*.wasm; do
            echo "Publishing: ${wasm}"
            ./scripts/package.sh "${wasm}" --sign
          done

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          {
            echo "## PHP WASM Release ${TAG}"
            echo ""
            echo "Built from tag \`${TAG}\` (commit \`${{ github.sha }}\`)"
            echo ""
            echo "### Artifacts"
            echo ""
            echo "| File | Profile | Size | SHA256 (first 12) |"
            echo "|------|---------|------|-------------------|"
            for wasm in out/*.wasm; do
              name=$(basename "$wasm")
              profile=$(echo "$name" | sed 's/^php-[^-]*-[^-]*-[^-]*-//' | sed 's/^.*-//' | sed 's/\.wasm$//')
              size=$(du -sh "$wasm" | cut -f1)
              sha=$(cat "${wasm}.sha256" | awk '{print $1}' | cut -c1-12)
              echo "| \`${name}\` | ${profile} | ${size} | \`${sha}...\` |"
            done
            echo ""
            echo "### OCI Artifacts (GHCR)"
            echo ""
            echo "Pull with oras:"
            echo "\`\`\`"
            echo "oras pull ghcr.io/${{ github.repository_owner }}/php-wasm:${TAG#v}-default"
            echo "\`\`\`"
            echo ""
            echo "### Limitations (wasm32-wasi Preview1)"
            echo ""
            echo "| Feature | Status |"
            echo "|---------|--------|"
            echo "| Networking (TCP/UDP) | Not available |"
            echo "| Threads / Fibers | Not available |"
            echo "| fork / exec / popen | Stubbed (ENOSYS) |"
            echo "| opcache / JIT | Disabled |"
            echo "| setitimer / signals | Emulated |"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            out/*.wasm
            out/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
