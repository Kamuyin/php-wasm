name: Build PHP WASM

on:
  push:
    branches: [main, master]
    paths:
      - 'versions/**'
      - 'patches/**'
      - 'profiles/**'
      - 'scripts/**'
      - 'docker/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to build (empty = all)'
        required: false
        default: ''
      profile:
        description: 'Build profile (empty = all)'
        required: false
        default: ''

jobs:
  build:
    name: PHP ${{ matrix.php }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        profile: [minimal, default, full]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker build layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.php }}-${{ matrix.profile }}-${{ hashFiles('docker/Dockerfile.builder', 'scripts/**', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.php }}-${{ matrix.profile }}-
            ${{ runner.os }}-buildx-${{ matrix.php }}-
            ${{ runner.os }}-buildx-

      - name: Cache PHP source tarball
        uses: actions/cache@v4
        with:
          path: /tmp/php-src-cache
          key: ${{ runner.os }}-php-src-${{ matrix.php }}-${{ hashFiles(format('versions/{0}/source.yaml', matrix.php)) }}
          restore-keys: |
            ${{ runner.os }}-php-src-${{ matrix.php }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.php }}-${{ matrix.profile }}-${{ hashFiles('docker/Dockerfile.builder', 'scripts/**', 'patches/**', 'versions/**', 'profiles/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.php }}-${{ matrix.profile }}-
            ${{ runner.os }}-ccache-${{ matrix.php }}-
            ${{ runner.os }}-ccache-

      - name: Build PHP ${{ matrix.php }} (${{ matrix.profile }} profile)
        run: |
          docker buildx build \
            --load \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --build-arg PROFILE=${{ matrix.profile }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to   type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag php-wasm-builder:${{ matrix.php }}-${{ matrix.profile }} \
            --file docker/Dockerfile.builder \
            .

      - name: Extract build artifacts
        run: |
          mkdir -p out
          docker run --rm \
            --mount type=bind,src="$(pwd)/out",dst=/out \
            --mount type=bind,src=/tmp/php-src-cache,dst=/tmp/php-src-cache \
            --mount type=bind,src=/tmp/.ccache,dst=/ccache \
            -e PHP_VERSION=${{ matrix.php }} \
            -e PROFILE=${{ matrix.profile }} \
            -e OUTPUT_DIR=/out \
            -e BUILD_CACHE_DIR=/tmp/php-src-cache \
            php-wasm-builder:${{ matrix.php }}-${{ matrix.profile }}
          ls -lh out/

      - name: Rotate Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Validate WASM binary
        id: validate
        continue-on-error: true
        run: |
          WASM_FILE=$(ls out/*.wasm | head -1)
          echo "Validating: ${WASM_FILE} ($(du -sh "${WASM_FILE}" | cut -f1))"
          # Check WASM magic bytes: 0x00 0x61 0x73 0x6D
          MAGIC=$(xxd -l 4 "${WASM_FILE}" | awk '{print $2$3}')
          if [[ "${MAGIC}" == "0061736d" ]]; then
            echo "WASM magic bytes: OK"
          else
            echo "ERROR: Invalid WASM magic bytes: ${MAGIC}"
            exit 1
          fi
          # Run wasm-validate if available (installed via wabt)
          if command -v wasm-validate &>/dev/null; then
            wasm-validate "${WASM_FILE}" && echo "wasm-validate: PASSED"
          else
            echo "wasm-validate: not available (install wabt for full validation)"
          fi

      - name: Emit SARIF on validation failure
        if: steps.validate.outcome == 'failure'
        run: |
          mkdir -p sarif
          cat > sarif/wasm-validate.sarif <<'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "wasm-validate",
                    "informationUri": "https://github.com/WebAssembly/wabt",
                    "rules": [
                      {
                        "id": "wasm-validate",
                        "name": "wasm-validate",
                        "shortDescription": {
                          "text": "The generated WebAssembly binary failed validation."
                        }
                      }
                    ]
                  }
                },
                "results": [
                  {
                    "ruleId": "wasm-validate",
                    "level": "error",
                    "message": {
                      "text": "wasm-validate failed for the generated artifact in this matrix job."
                    }
                  }
                ]
              }
            ]
          }
          EOF

      - name: Upload SARIF
        if: steps.validate.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/wasm-validate.sarif

      - name: Fail after validation errors
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php }}-${{ matrix.profile }}-wasm
          path: |
            out/*.wasm
            out/*.sha256
          if-no-files-found: error
          retention-days: 30

  summarize:
    name: Build Summary
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Write summary
        run: |
          echo "## Build Matrix Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| PHP | Profile | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|---------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.2 | minimal | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.2 | default | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.2 | full    | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.3 | minimal | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.3 | default | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.3 | full    | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.4 | minimal | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.4 | default | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8.4 | full    | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
