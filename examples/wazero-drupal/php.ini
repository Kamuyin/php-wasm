; php.ini for Drupal-on-WASI
; Mounted at /etc/php inside the WASM sandbox.

memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 180

log_errors = On
error_log = /dev/stderr

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

date.timezone = UTC
session.save_path = /tmp
upload_tmp_dir = /tmp

; Not available under WASI Preview1.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

; Polyfill POSIX file-permission functions that are absent in this WASM build
; (the WASI patch removes chmod/chown/lchown since WASI Preview1 has no chmod
; syscall). Defined as user-land stubs so namespaced code falls back correctly.
auto_prepend_file = /etc/php/wasi-stubs.php

; OPcache — file-cache-only mode.
;
; Each request spawns a fresh WASM module instance (fresh process), so the
; in-memory shared-memory segment has zero cross-request benefit AND causes
; problems on WASI: wasi-libc backs MAP_SHARED|MAP_ANONYMOUS with malloc, but
; munmap() rejects those pointers (EINVAL) on shutdown, and the 64 MB allocation
; can corrupt subsequent heap allocations within the same instance.
;
; file_cache_only=1 skips shared-memory init entirely (ZendAccelerator.c l.3199
; guards the whole shm path behind `if (!file_cache_only)`). OPcache instead
; reads/writes pre-compiled bytecode from /tmp/opcache/ which is the host's /tmp
; mounted into every WASM instance — bytecode written on request N is read on
; request N+1, avoiding re-parsing ~300+ PHP files per page load.
;
; JIT is auto-disabled at compile time (wasm32 has no JIT backend).
; validate_timestamps=0: Drupal files never change at runtime in this demo.
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 1
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.jit = disable
