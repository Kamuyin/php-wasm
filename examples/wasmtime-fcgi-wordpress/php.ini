; php.ini for WordPress-on-WASI
; Mounted at /etc/php inside the WASM sandbox.

; WordPress recommends at least 64M; 128M is comfortable for plugins.
memory_limit = 128M

; File uploads (plugin/theme installs disabled via WP_HTTP_BLOCK_EXTERNAL,
; but media uploads work if gd is enabled in the profile).
upload_max_filesize = 8M
post_max_size = 10M

; Longer max execution time for the WP install wizard.
max_execution_time = 120

; Log PHP errors to stderr (captured by the Go host and printed to its log).
log_errors = On
error_log = /dev/stderr

; Show errors only in debug mode — set display_errors = On for local dev.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Date/time
date.timezone = UTC

; Session storage (PHP sessions in /tmp survive across requests on the same host).
session.save_path = /tmp

; Disable functions WordPress doesn't use and that have no WASI implementation.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 1
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.jit = disable
